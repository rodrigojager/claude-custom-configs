onboarding = false
[update]
channel = "preview"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
pane_gaps = false
copy_on_select = true
status_indicators = "symbols"
agent_panel_sort = "priority"

[ui.sidebar.agents]
row_gap = 0
rows = [
	["state_icon", {token = "terminal_title_stripped", dim = false, fg = "#a0a0a0"}],
	[{token = "workspace", dim = true, bold = false}]
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
	["state_icon", "workspace", "branch", "git_status"]
]

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[theme]
name = "dracula"
auto_switch = false

[ui.sidebar.agents.rows_by_agent]
pi = [["state_icon", {token = "terminal_title_stripped", dim = false, fg = "#a0a0a0"}], [{token = "workspace", dim = true, bold = false}], ["$model_info"]]
claude = [["state_icon", {token = "terminal_title_stripped", dim = false, fg = "#a0a0a0"}], [{token = "workspace", dim = true, bold = false}], ["$model_info"]]
